[package]
name = "hw"
version = "2026.40.1"
edition = "2024"
rust-version = "1.95"
description = "Read-only command-line client for the HookahWork CRM API"
license = "MIT"

[features]
# Test-only seams (`IoStreams::test`, `test_util::FakeApi`, recording sleepers) for
# integration tests under `tests/`; never enabled by a production build.
test-util = []

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.3"
camino = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Logging. No `tracing-log` bridge on purpose: ureq logs the raw wire (Authorization
# header included) through `log` at TRACE, and unbridged `log` records go nowhere.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "smallvec", "std"] }

# HTTP (sync; default features bring rustls + gzip)
ureq = { version = "3", features = ["json"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
toon-format = { version = "0.5", default-features = false }

# Auth
keyring-core = "1"
# Interactive `hw auth login`; the crossterm backend draws on stderr, never stdout.
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }

# Config
dirs = "7"

# Dates and CRM time zones
jiff = "0.2"

# Pager command splitting
shlex = "2"

# Output
comfy-table = "8"
csv = "1"

# --jq / --template post-processing
jaq-core = "3"
jaq-std = "3"
jaq-json = { version = "2", features = ["serde"] }
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }

[target.'cfg(unix)'.dependencies]
# Restores the default SIGPIPE disposition so `hw ... | head` exits cleanly.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1"

[dev-dependencies]
# Self dev-dependency: integration tests build the lib with `test-util` under plain `cargo test`.
hw = { path = ".", features = ["test-util"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
httpmock = "0.8"
pretty_assertions = "1"
insta = { version = "1", features = ["json", "filters"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
debug = 0
