# cargo-deny configuration
#
# Run locally with: cargo deny check
# CI gate: .github/workflows/ci.yml (job: deny)

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # webpki-root-certs (bundled Mozilla trust roots, transitive via rustls).
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The self dev-dependency (`hw = { path = "." }`) enables `test-util` for tests/;
# path deps are local, registry wildcards stay denied.
allow-wildcard-paths = true
highlight = "all"
deny = [
  # ureq logs the raw wire (incl. Authorization) through `log` at TRACE; a log→tracing
  # bridge would put the token on stderr under -vvv.
  { crate = "tracing-log", reason = "would forward ureq's TRACE wire logs (Authorization header) to stderr" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
